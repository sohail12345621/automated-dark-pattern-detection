<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automated Dark Pattern Detection System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="header">
        <div class="container">
            <h1>Automated Dark Pattern Detection System</h1>
            <p>UI Deception Analysis & Evidence-Based Flagging</p>
        </div>
    </header>
    <main class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}
        
        <section class="card">
            <h2>Scan Website</h2>
            <form action="{{ url_for('start_scan') }}" method="POST" class="scan-form">
                <input type="text" name="url" placeholder="Enter Website URL (e.g. https://example.com)" required>
                <button type="submit" class="btn">Scan Website</button>
            </form>
        </section>
    </main>
</body>
</html>
