<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scan Results - Dark Pattern Detector</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="header">
        <div class="container">
            <h1>Scan Results</h1>
            <a href="{{ url_for('index') }}" class="nav-link">← Back to Scanner</a>
        </div>
    </header>
    <main class="container">
        <section class="card">
            <h2>Website: {{ scan.url }}</h2>
            <p>Scan ID: {{ scan.id }} | Date: {{ scan.scan_date }}</p>
            <p>Elements Analyzed: {{ scan.total_elements }} | Patterns Detected: {{ scan.total_detections }}</p>
        </section>
    </main>
</body>
</html>
